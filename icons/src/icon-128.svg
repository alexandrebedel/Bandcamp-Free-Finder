<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Record, slid half out of the sleeve. Artwork stays inside 16..112:
       the Chrome Web Store wants 96 px of art with 16 px of padding. -->
  <circle cx="78" cy="50" r="33" fill="#0b0f0d" stroke="#a9bfb1" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="78" cy="50" r="25" fill="none" stroke="#2a342e" stroke-width="1.5"/>
  <circle cx="78" cy="50" r="18" fill="none" stroke="#2a342e" stroke-width="1.5"/>
  <circle cx="78" cy="50" r="9" fill="#a9bfb1"/>
  <circle cx="78" cy="50" r="2" fill="#0b0f0d"/>
  <!-- Sleeve, with a light rim so it holds on dark toolbars. -->
  <rect x="17" y="33" width="78" height="78" rx="6" fill="#0f1411" stroke="#a9bfb1" stroke-opacity="0.4" stroke-width="2"/>
  <!-- The band the extension puts on free covers, with its ink hairline. -->
  <path d="M16 90 H96 V106 A6 6 0 0 1 90 112 H22 A6 6 0 0 1 16 106 Z" fill="#3ee07f"/>
  <path d="M17 91 H95" stroke="#04150b" stroke-opacity="0.35" stroke-width="2"/>
</svg>
